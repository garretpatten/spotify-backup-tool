name: Semgrep Scan

permissions:
  contents: read

on: pull_request

jobs:
  semgrep-scan:
    name: semgrep-scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep

    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: semgrep ci --config=auto
